name: Build Android (Google Play AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Build Debug APK (.apk for Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YDS-Soru-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YDS-Soru-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
